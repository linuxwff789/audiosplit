name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        env:
          GIT_SHA: ${{ github.sha }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK with a cached debug key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          for apk in $(find app/build/outputs/apk -name "*unsigned.apk"); do
            out="${apk/-unsigned/}"
            echo "Signing: $apk -> $out"
            cp "$apk" "$out"
            "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" \
              --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
              "$out"
          done
          find app/build/outputs/apk -name "*.apk" -exec "$APKSIGNER" verify --print-certs {} \; | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioSplit-apk
          path: app/build/outputs/apk/release/*.apk
